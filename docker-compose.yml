services:
  db:
    image: postgres:17-alpine
    container_name: folketinget-db
    environment:
      POSTGRES_USER: folketinget
      POSTGRES_PASSWORD: folketinget
      POSTGRES_DB: folketinget
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folketinget -d folketinget"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
